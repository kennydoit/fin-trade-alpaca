[project]
name = "fin-trade-alpaca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"alpaca-py",
	"numpy",
	"pandas",
	"python-dotenv",
	"pyyaml",
	"requests",
	"yfinance",
	"matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "vulture>=2.0",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.ruff]
# Target Python 3.11+
target-version = "py311"

# Line length to match common practice
line-length = 120

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "aws/functions/*/src",  # Lambda copies
    ".pytest_cache",
    "reports",
]

[tool.ruff.lint]
# Enable important rule categories
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
    "PERF",   # performance optimizations
]

# Ignore specific rules that may be too strict for this project
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR2004", # Magic value used in comparison
    "RET504",  # Unnecessary variable assignment before return
    "ARG001",  # Unused function argument (common in callbacks)
    "ARG002",  # Unused method argument
]

[tool.ruff.lint.per-file-ignores]
# Test files can have unused imports and different patterns
"tests/*.py" = ["F401", "ARG"]
"test_*.py" = ["F401", "ARG"]
# Init files often have unused imports for re-exports
"__init__.py" = ["F401"]
# ML feature/model code follows scikit-learn's capitalized-matrix convention
# (X, X_train, X_test) which is the idiomatic, widely-recognized naming for
# 2D feature arrays in this ecosystem - overriding pep8-naming here.
"src/yfinance/screener/feature_engineering.py" = ["N806"]
"src/yfinance/screener/model_training.py" = ["N806", "N803"]
"src/yfinance/screener/scoring.py" = ["N806"]
"tests/test_predict_short_term.py" = ["N806"]

# --- Pre-existing debt, not yet brought up to the CI lint gate ---
# These files predate the ruff rollout and have known findings that would be
# risky to bulk-autofix without careful behavioral review (e.g. loop-variable
# closures, exception chaining). Tracked as follow-up cleanup in
# CODE_QUALITY.md rather than silently loosening rules repo-wide.
"src/runners/clone_live_to_paper.py" = ["PLR0915", "PLR0917", "PLR0911", "F841"]
"src/runners/predict_screener.py" = ["E402", "PLR0917", "PLC0415", "PLR0915", "SIM108"]
"src/runners/yfinance_growth_screener.py" = ["E402", "PLC0415", "PLR0915", "SIM102", "E731", "PLR0917", "PERF402"]
"src/yfinance/__init__.py" = ["SIM108"]
"src/yfinance/screener/dedup_by_correlation.py" = ["SIM108", "PLC0415", "B904", "N806", "B905", "PLR0917", "PLW0108"]
"src/yfinance/screener/enhanced_features.py" = ["B006", "B023"]
"src/yfinance/screener/rank_candidates.py" = ["PLR0915", "B905", "B007", "PERF402"]
"src/yfinance/screener/yfinance_equity_screener.py" = [
    "PLR0917", "PLR0911", "PLR0915", "PLC0415", "N806", "SIM108", "E731", "B023",
]
"tests/test_industry_filtering_fix.py" = ["PLW1510", "PLC0415"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false

[tool.vulture]
# Minimum confidence for dead code detection (0-100)
min_confidence = 80
# Paths to check
paths = ["src", "tools"]
# Exclude patterns
exclude = ["aws/"]

[tool.pytest.ini_options]
# Restrict discovery to tests/ only. Without this, pytest's default recursive
# discovery would also pick up tools/test_*.py and tools/*_test.py ad-hoc
# diagnostic scripts (e.g. tools/test_bracket_order.py) which import Alpaca
# clients and expect live credentials/network access at import time -- those
# are manual diagnostic scripts, not automated unit tests, and collecting
# them breaks reproducible CI runs.
testpaths = ["tests"]
# Make `src` importable as top-level packages (runners, yfinance) the same
# way the runtime scripts expect, without requiring `pip install -e .` first.
pythonpath = ["src"]

[tool.mypy]
# Incremental type-safety gate: starts permissive (only checks files that
# already opt in) and can be tightened bucket-by-bucket over time. Trading
# code that touches money should graduate to strict checking first.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
