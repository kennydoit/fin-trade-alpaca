name: CI

# Quality gate for the codebase: lint, format-check, and unit tests.
# This is intentionally separate from any trading-automation schedule -- it
# runs on every push/PR to catch regressions before they reach a runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        # Scoped to src/ and tests/ -- the actively-maintained, tested code
        # paths. tools/, scripts/, console/, database/, sandbox/ carry
        # pre-existing lint debt not yet brought up to this gate (see
        # CODE_QUALITY.md); expand this scope as they're cleaned up.
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest tests/ -q
